<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Gamedev Canvas Workshop</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      canvas {
        background: #eeeeee;
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <canvas id="myCanvas" width="480" height="320"></canvas>

    <script>
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");

      let x = canvas.width / 2;
      let y = canvas.height - 30;
      let dx = 1;
      let dy = -1;
      const ballRadius = 15;
      let ballColor = "#fcba03";

      let paddleSpeed = 1;
      const paddleSpeedIncreaseThreshold = 6;
      const paddleSpeedIncrement = 2;
      const paddleHeight = 10;
      const paddleWidth = 80;
      let paddleX = (canvas.width - paddleWidth) / 2;
      let rightPressed = false;
      let leftPressed = false;
      let interval = 0;

      const brickRowCount = 3;
      const brickColumnCount = 7;
      const brickWidth = 50;
      const brickHeight = 20;
      const brickPadding = 10;
      const brickOffsetTop = 30;
      const brickOffsetLeft = 30;

      let bricks = [];
      let score = 0;
      let lives = 3;
      let nextMilestone = 50;
      let maxBounceAngle = Math.PI / 3;
      let bricksRemaining = brickRowCount * brickColumnCount;

      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1 };
        }
      }

      function drawBricks() {
        for (let c = 0; c < brickColumnCount; c++) {
          for (let r = 0; r < brickRowCount; r++) {
            if (bricks[c][r].status === 1) {
              const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
              const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
              bricks[c][r].x = brickX;
              bricks[c][r].y = brickY;
              ctx.beginPath();
              ctx.rect(brickX, brickY, brickWidth, brickHeight);
              ctx.fillStyle = "#fcba03";
              ctx.fill();
              ctx.closePath();
            }
          }
        }
      }

      function drawBall() {
        ctx.beginPath();
        ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
        ctx.fillStyle = ballColor;
        ctx.fill();
        ctx.closePath();
      }

      function drawPaddle() {
        ctx.beginPath();
        ctx.rect(
          paddleX,
          canvas.height - paddleHeight,
          paddleWidth,
          paddleHeight,
        );
        ctx.fillStyle = "#fcba03";
        ctx.fill();
        ctx.closePath();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBricks();
        drawBall();
        drawPaddle();
        drawScore();
        drawLives();
        collisionDetection();

        if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
          dx = -dx;
          ballColor = getRandomColor();
        }
        if (y + dy < ballRadius) {
          dy = -dy;
          ballColor = getRandomColor();
        } else if (y + dy > canvas.height - ballRadius) {
          if (x > paddleX && x < paddleX + paddleWidth) {
            let hitPoint = (x - paddleX) / paddleWidth;

            let angle = (hitPoint - 0.5) * maxBounceAngle;

            let speed = Math.sqrt(dx * dx + dy * dy);

            dx = speed * Math.sin(angle);
            dy = -speed * Math.cos(angle);
          } else {
            lives--;
            if (!lives) {
              alert("GAME OVER");
              document.location.reload();
            } else {
              x = canvas.width / 2;
              y = canvas.height - 30;
              dx = 1;
              dy = -1;
              paddleX = (canvas.width - paddleWidth) / 2;
              dy = -Math.abs(dy);
            }
          }
        }

        if (rightPressed) {
          paddleX = Math.min(paddleX + paddleSpeed, canvas.width - paddleWidth);
        } else if (leftPressed) {
          paddleX = Math.max(paddleX - paddleSpeed, 0);
        }

        x += dx;
        y += dy;

        requestAnimationFrame(draw);
      }

      document.addEventListener("keydown", keyDownHandler);
      document.addEventListener("keyup", keyUpHandler);

      function keyDownHandler(e) {
        if (e.key === "Right" || e.key === "ArrowRight") {
          rightPressed = true;
        } else if (e.key === "Left" || e.key === "ArrowLeft") {
          leftPressed = true;
        }
      }

      function keyUpHandler(e) {
        if (e.key === "Right" || e.key === "ArrowRight") {
          rightPressed = false;
        } else if (e.key === "Left" || e.key === "ArrowLeft") {
          leftPressed = false;
        }
      }

      document.addEventListener("mousemove", mouseMoveHandler);

      function mouseMoveHandler(e) {
        const relativeX = e.clientX - canvas.offsetLeft;
        if (relativeX > 0 && relativeX < canvas.width) {
          paddleX = Math.max(
            0,
            Math.min(relativeX - paddleWidth / 2, canvas.width - paddleWidth),
          );
        }
      }

      function collisionDetection() {
        for (let c = 0; c < brickColumnCount; c++) {
          for (let r = 0; r < brickRowCount; r++) {
            const b = bricks[c][r];
            if (b.status === 1) {
              if (
                x + ballRadius > b.x &&
                x - ballRadius < b.x + brickWidth &&
                y + ballRadius > b.y &&
                y - ballRadius < b.y + brickHeight
              ) {
                dy = -dy;

                dx *= 1.06;
                dy *= 1.06;
                ballColor = getRandomColor();

                b.status = 0;
                bricksRemaining--;

                score += (brickRowCount - r) * 10;

                if (
                  (brickRowCount * brickColumnCount - bricksRemaining) %
                    paddleSpeedIncreaseThreshold ===
                  0
                ) {
                  paddleSpeed += paddleSpeedIncrement;
                }

                if (score >= nextMilestone) {
                  nextMilestone += 50;

                  lives++;

                  maxBounceAngle += Math.PI / 12;
                }

                if (bricksRemaining === 0) {
                  alert("YOU WIN, CONGRATULATIONS! YOU SCORED: " + score);
                  document.location.reload();
                }
              }
            }
          }
        }
      }

      function drawScore() {
        ctx.font = "16px Arial";
        ctx.fillStyle = "#0095DD";
        ctx.fillText(`Score: ${score}`, 8, 20);
      }

      function drawLives() {
        ctx.font = "16px Arial";
        ctx.fillStyle = "#0095DD";
        ctx.fillText(`Lives: ${lives}`, canvas.width - 65, 20);
      }

      function getRandomColor() {
        return `#${Math.floor(Math.random() * 16777215).toString(16)}`;
      }

      draw();
    </script>
  </body>
</html>
